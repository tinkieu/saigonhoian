// So sánh 2 giá trị "Kì" để sắp xếp: Q1-Q4 theo đúng thứ tự, các kì tự đặt (thanh tra, kiểm toán đột xuất...) xếp sau, theo alphabet
function compareKi(a, b) {
  const ia = QUARTERS.indexOf(a), ib = QUARTERS.indexOf(b);
  if (ia >= 0 && ib >= 0) return ia - ib;
  if (ia >= 0) return -1;
  if (ib >= 0) return 1;
  return String(a || '').localeCompare(String(b || ''), 'vi');
}

  return Array.from(set).filter(Boolean).sort(compareKi);
}

function normalizeQuarter(raw) {

  if (s.includes('iv') || s === 'q4' || s === '4') return 'Q4';

  if (s.includes('ii') || s === 'q2' || s === '2') return 'Q2';
  if (s.includes('i') || s === 'q1' || s === '1') return 'Q1';
  return String(raw || '').trim();
}
// Chuẩn hoá khoa/tên người: gộp theo chữ thường không phân biệt hoa/thường, hiển thị theo biến thể xuất hiện nhiều nhất
function buildNormalizer(values) {
  const counts = new Map();
  values.forEach((v) => {
    const raw = String(v || '').trim();
    if (!raw) return;
    const key = raw.toLowerCase();
    if (!counts.has(key)) counts.set(key, new Map());
    const m = counts.get(key);
    m.set(raw, (m.get(raw) || 0) + 1);
  });
  const canonical = new Map();
  counts.forEach((m, key) => {
    let best = null, bestN = -1;
    m.forEach((n, text) => { if (n > bestN) { best = text; bestN = n; } });
    canonical.set(key, best);
  });
  return (v) => {
    const raw = String(v || '').trim();
    if (!raw) return '';
    return canonical.get(raw.toLowerCase()) || raw;
  };
}

async function init() {

    app.innerHTML = `

}

// ---------------------------------------------------------------
// DATA LOADING
// ---------------------------------------------------------------
// Supabase mặc định chỉ trả về tối đa 1000 dòng/lần gọi — hàm này tự lấy theo từng đợt cho đến khi hết,
// để không bị "mất" dữ liệu khi bảng có hơn 1000 dòng.
async function fetchAllRows(table, orderCols, filterFn) {
  const PAGE = 1000;
  let all = [];
  let from = 0;
  while (true) {
    let q = sb.from(table).select('*');
    if (filterFn) q = filterFn(q);
    q = q.range(from, from + PAGE - 1);
    (orderCols || []).forEach((c) => { q = q.order(c); });
    const { data, error } = await q;
    if (error) { console.error('fetchAllRows lỗi', table, error); break; }
    all = all.concat(data || []);
    if (!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}

// Quy 1 tên Khoa về đúng tên chuẩn đã khai báo trong Ánh xạ tên Khoa (nếu có), giữ nguyên nếu chưa khai báo
function resolveKhoaAlias(name) {
  const n = String(name || '').trim();
  if (!n) return n;
  const alias = state.khoaAliases.find((a) => a.alias_name === n);
  return alias ? alias.canonical_name : n;
}
// Chuẩn hoá tên Khoa: gộp hoa/thường trước (buildNormalizer), rồi áp ánh xạ thủ công (bhyt_khoa_aliases)
function buildKhoaNormalizer() {
  const caseNorm = buildNormalizer(state.lines.map((l) => l.department));
  return (raw) => resolveKhoaAlias(caseNorm(raw));
}

// Quy 1 mã Phụ lục về đúng mã chuẩn đã khai báo trong Ánh xạ mã chuyên đề (nếu có), giữ nguyên nếu chưa khai báo
function resolveCode(rawCode) {
  const c = String(rawCode || '').trim();
  if (!c) return c;
  const alias = state.codeAliases.find((a) => a.alias_code === c);

// ---------------------------------------------------------------
// DERIVED DATA — core aggregates
// ---------------------------------------------------------------
// quarterList() được gọi rất nhiều lần trong 1 lượt vẽ lại trang (mỗi dòng dữ liệu khi lọc theo kì đều gọi tới nó).
// Nhớ lại (cache) kết quả trong 1 lượt vẽ để tránh tính toán lặp lại nhiều lần trên toàn bộ dữ liệu — nếu không sẽ ngày càng
// chậm khi dữ liệu tích luỹ nhiều quý (độ phức tạp tăng theo bình phương thay vì tuyến tính). Cache được xoá mỗi lần renderTab() chạy.
let _quarterListCache = null;
function invalidateQuarterListCache() { _quarterListCache = null; }
function quarterList() {
  if (_quarterListCache) return _quarterListCache;
  const map = new Map();
  state.periods.forEach((p) => map.set(qKey(p.quarter, p.year), { quarter: p.quarter, year: p.year, revenue: p.revenue || 0 }));
  state.lines.forEach((l) => {
    const k = qKey(l.quarter, l.year);
    if (!map.has(k)) map.set(k, { quarter: l.quarter, year: l.year, revenue: 0 }); // có dữ liệu nhưng chưa nhập doanh thu — vẫn hiển thị, doanh thu tạm để 0
  });
  _quarterListCache = Array.from(map.values()).map((v) => ({ ...v, key: qKey(v.quarter, v.year) }))
    .sort((a, b) => a.year - b.year || compareKi(a.quarter, b.quarter));
  return _quarterListCache;
}
// Kiểm tra 1 kì (quý+năm) có nằm trong khoảng "Từ kì / Đến kì" đang chọn hay không
function kiInRange(quarter, year) {
  if (state.dashKiFrom === 'ALL' && state.dashKiTo === 'ALL') return true;
  const list = quarterList();
  const idx = list.findIndex((k) => k.quarter === quarter && k.year === year);
  if (idx === -1) return true; // kì lạ không có trong danh sách chuẩn — không loại trừ
  const fromIdx = state.dashKiFrom === 'ALL' ? 0 : list.findIndex((k) => k.key === state.dashKiFrom);
  const toIdx = state.dashKiTo === 'ALL' ? list.length - 1 : list.findIndex((k) => k.key === state.dashKiTo);
  return idx >= (fromIdx === -1 ? 0 : fromIdx) && idx <= (toIdx === -1 ? list.length - 1 : toIdx);
}
// Giống kiInRange nhưng nhận trực tiếp mốc từ/đến (dùng để tính 2 giai đoạn so sánh độc lập, không qua bộ lọc toàn cục)
function kiInRangeExplicit(quarter, year, fromKey, toKey) {
  if (fromKey === 'ALL' && toKey === 'ALL') return true;
  const list = quarterList();
  const idx = list.findIndex((k) => k.quarter === quarter && k.year === year);
  if (idx === -1) return true;
  const fromIdx = fromKey === 'ALL' ? 0 : list.findIndex((k) => k.key === fromKey);
  const toIdx = toKey === 'ALL' ? list.length - 1 : list.findIndex((k) => k.key === toKey);
  return idx >= (fromIdx === -1 ? 0 : fromIdx) && idx <= (toIdx === -1 ? list.length - 1 : toIdx);
}
// Tổng hợp số liệu của 1 giai đoạn (từ kì -> đến kì): tổng chi phí, tổng doanh thu, số kì, TB/kì, tỉ lệ
function rangeSummary(fromKey, toKey) {
  const rows = state.lines.filter((l) => kiInRangeExplicit(l.quarter, l.year, fromKey, toKey));
  const periodsInRange = quarterList().filter((q) => kiInRangeExplicit(q.quarter, q.year, fromKey, toKey));
  const totalCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
  const totalRevenue = periodsInRange.reduce((s, q) => s + (q.revenue || 0), 0);
  const periodCount = periodsInRange.length;
  return {
    rows, totalCost, totalRevenue, periodCount,
    avgCostPerPeriod: periodCount ? totalCost / periodCount : 0,
    rate: totalRevenue ? totalCost / totalRevenue : null,
    periodLabels: periodsInRange.map((q) => q.quarter + '/' + q.year),
  };
}
// Gộp chi phí theo 1 chiều: 'nhom' (nhóm lỗi), 'chuyende' (mã chuyên đề), 'khoa'
function breakdownByDimension(rows, dimension) {
  const nKhoa = khoaNormalizer();
  const map = new Map();
  rows.forEach((l) => {
    let key, label;
    if (dimension === 'nhom') { key = categoryGroupOf(l.code); label = key; }
    else if (dimension === 'chuyende') { key = l.code || '(không mã)'; label = key + (categoryNameOf(l.code) ? ' — ' + categoryNameOf(l.code) : ''); }
    else { key = nKhoa(l.department) || '(chưa rõ)'; label = key; }
    if (!map.has(key)) map.set(key, { key, label, cost: 0 });
    map.get(key).cost += l.cost || 0;
  });
  return map;
}
// So sánh 2 giai đoạn theo 1 chiều (nhóm/chuyên đề/khoa): trả về danh sách hợp nhất, sắp theo tổng chi phí giảm dần
function compareBreakdown(rowsA, totalA, rowsB, totalB, dimension) {
  const mapA = breakdownByDimension(rowsA, dimension);
  const mapB = breakdownByDimension(rowsB, dimension);
  const allKeys = new Set([...mapA.keys(), ...mapB.keys()]);
  const list = Array.from(allKeys).map((key) => {
    const a = mapA.get(key), b = mapB.get(key);
    const costA = a ? a.cost : 0, costB = b ? b.cost : 0;
    return {
      key, label: (a && a.label) || (b && b.label) || key,
      costA, pctA: totalA ? (costA / totalA) * 100 : 0,
      costB, pctB: totalB ? (costB / totalB) * 100 : 0,
      delta: costB - costA,
    };
  });
  return list.sort((x, y) => (y.costA + y.costB) - (x.costA + x.costB));
}
function quarterSummaries(sourceRows) {
  const src = sourceRows || state.lines;
  const qs = quarterList();
  return qs.map((p) => {
    const rows = src.filter((l) => l.quarter === p.quarter && l.year === p.year);
    const finalizedCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
    return {
      key: p.key, label: `${p.quarter}/${p.year}`, quarter: p.quarter, year: p.year,
      revenue: p.revenue, finalizedCost, lineCount: rows.length,
      rateVsRevenue: p.revenue ? finalizedCost / p.revenue : null,
    };
  });
}
function availableYears() { return Array.from(new Set(state.periods.map((p) => p.year))).sort((a, b) => a - b); }

function filteredQuarterSummaries() {
  let qs = quarterSummaries();
  qs = qs.filter((q) => kiInRange(q.quarter, q.year));
  return qs;
}
function grandTotal(qs) {
  const revenue = qs.reduce((s, q) => s + q.revenue, 0);
  const finalizedCost = qs.reduce((s, q) => s + q.finalizedCost, 0);
  const lineCount = qs.reduce((s, q) => s + q.lineCount, 0);
  return { revenue, finalizedCost, lineCount, rateVsRevenue: revenue ? finalizedCost / revenue : null };
}
function currentAndPreviousPeriod() {
  const all = quarterSummaries();
  if (all.length === 0) return { current: null, previous: null, all, idx: -1 };
  const filtered = filteredQuarterSummaries();
  const current = filtered.length ? filtered[filtered.length - 1] : all[all.length - 1];
  const idx = all.findIndex((q) => q.key === current.key);
  const previous = idx > 0 ? all[idx - 1] : null;
  return { current, previous, idx, all };
}

function categoryNameOf(code) {
  const c = state.categories.find((x) => x.code === code);
  return c ? c.name : '';
}
function categoryGroupOf(code) {
  const c = state.categories.find((x) => x.code === code);
  return (c && c.category_group) ? c.category_group : '(chưa phân nhóm)';
}

function categorySummaries(sourceRows) {
  const src = sourceRows || state.lines;
  const byCode = new Map();
  src.forEach((l) => {
    if (!l.code) return;
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, name: categoryNameOf(l.code) || l.error_desc || '', finalizedCost: 0, lineCount: 0, quarters: new Set() });
    const rec = byCode.get(l.code);
    rec.finalizedCost += l.cost || 0;
    rec.lineCount += 1;
    rec.quarters.add(qKey(l.quarter, l.year));
  });
  return Array.from(byCode.values()).map((r) => ({ ...r, quarterCount: r.quarters.size }));
}

function groupTotalsForQuarter(q, sourceRows) {
  if (!q) return {};
  const src = sourceRows || state.lines;
  const totals = {};
  src.filter((l) => l.quarter === q.quarter && l.year === q.year).forEach((l) => {
    const g = categoryGroupOf(l.code);
    totals[g] = (totals[g] || 0) + (l.cost || 0);
  });
  return totals;
}
function groupCostBreakdown() {
  const totals = {};
  scopedLines().forEach((l) => {
    const g = categoryGroupOf(l.code);
    totals[g] = (totals[g] || 0) + (l.cost || 0);
  });
  return totals;
}

function currentPeriodAlerts() {
  const { current, all, idx } = currentAndPreviousPeriod();
  if (!current) return null;
  const priorKeys = new Set(all.slice(0, idx).map((q) => q.key));
  const priorCodes = new Set(state.lines.filter((l) => priorKeys.has(qKey(l.quarter, l.year))).map((l) => l.code));
  const currentRows = state.lines.filter((l) => qKey(l.quarter, l.year) === current.key);
  const currentCodes = Array.from(new Set(currentRows.map((l) => l.code)));
  const newCodes = currentCodes.filter((c) => !priorCodes.has(c)).map((c) => ({ code: c, name: categoryNameOf(c) }));
  const repeatedCodes = currentCodes.filter((c) => priorCodes.has(c)).map((c) => ({ code: c, name: categoryNameOf(c) }));
  const causeCounts = {};
  currentRows.forEach((l) => { const c = l.cause || 'Chưa xác định'; causeCounts[c] = (causeCounts[c] || 0) + 1; });
  return { current, newCodes, repeatedCodes, causeCounts, totalRows: currentRows.length };
}

function paretoData(metric, scope, topN) {
  let rows = scope === 'filtered' ? scopedLines() : state.lines;
  const byCode = new Map();
  rows.forEach((l) => {
    if (!l.code) return;
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, value: 0 });
    byCode.get(l.code).value += metric === 'cost' ? (l.cost || 0) : 1;
  });
  const sorted = Array.from(byCode.values()).filter((r) => r.value > 0).sort((a, b) => b.value - a.value).slice(0, topN);
  const total = Array.from(byCode.values()).reduce((s, r) => s + r.value, 0);
  let cum = 0;
  return sorted.map((r) => { cum += r.value; return { ...r, cumPct: total ? (cum / total) * 100 : 0 }; });
}

function khoaNormalizer() { return state.khoaNorm || buildKhoaNormalizer(); }
function bacSiNormalizer() { return state.bacSiNorm || buildNormalizer(state.lines.map((l) => l.individual)); }
function remediatorNormalizer() { return state.remediatorNorm || buildNormalizer(state.lines.map((l) => l.remediator)); }
function khoaList() { const n = khoaNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.department)).filter(Boolean))).sort(); }
function bacSiList() { const n = bacSiNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.individual)).filter(Boolean))).sort(); }
function remediatorList() { const n = remediatorNormalizer(); return Array.from(new Set(state.lines.map((l) => n(l.remediator)).filter(Boolean))).sort(); }
function nhomList() { return Array.from(new Set(state.categories.map((c) => c.category_group).filter(Boolean))).sort(); }

// Áp dụng toàn bộ bộ lọc (năm/kỳ/khoa/bác sĩ/nhóm lỗi/nguyên nhân/người khắc phục/tìm kiếm chuyên đề) lên danh sách dòng dữ liệu gốc
function categoryMatchesSearch(code) {
  const q = state.overviewCatSearch.trim().toLowerCase();
  if (!q) return true;
  const name = (categoryNameOf(code) || '').toLowerCase();
  return (code || '').toLowerCase().includes(q) || name.includes(q);
}
function scopedLines() {
  const nKhoa = khoaNormalizer(), nBacSi = bacSiNormalizer(), nRem = remediatorNormalizer();
  let rows = state.lines;
  rows = rows.filter((l) => kiInRange(l.quarter, l.year));
  if (state.filterKhoa !== 'ALL') rows = rows.filter((l) => nKhoa(l.department) === state.filterKhoa);
  if (state.filterBacSi !== 'ALL') rows = rows.filter((l) => nBacSi(l.individual) === state.filterBacSi);
  if (state.filterNhom !== 'ALL') rows = rows.filter((l) => categoryGroupOf(l.code) === state.filterNhom);
  if (state.filterCause !== 'ALL') rows = rows.filter((l) => (l.cause || '') === state.filterCause);
  if (state.filterRemediator !== 'ALL') rows = rows.filter((l) => nRem(l.remediator) === state.filterRemediator);
  rows = rows.filter((l) => categoryMatchesSearch(l.code));
  return rows;
}
// Giống scopedLines nhưng KHÔNG lọc theo 1 Kì cụ thể — dùng cho các biểu đồ xu hướng nhiều kì ở Tổng quan
function overviewTrendScope() {
  return scopedLines();
}
function scopedTotals() {
  const rows = scopedLines();
  const finalizedCost = rows.reduce((s, r) => s + (r.cost || 0), 0);
  const lineCount = rows.length;
  let revenue = filteredQuarterSummaries().reduce((s, q) => s + q.revenue, 0);
  return { finalizedCost, lineCount, revenue, rateVsRevenue: revenue ? finalizedCost / revenue : null };
}

// ---------------------------------------------------------------
// DERIVED DATA — Khoa / Cá nhân heatmap
// ---------------------------------------------------------------
function heatmapData(mode, axis, metric, cause) {
  const field = mode === 'department' ? 'department' : 'individual';
  const normalize = mode === 'department' ? khoaNormalizer() : bacSiNormalizer();
  let baseLines = state.lines;
  if (cause && cause !== 'ALL') baseLines = baseLines.filter((l) => (l.cause || '') === cause);
  const rows = baseLines.map((l) => ({ ...l, _entity: normalize(l[field]) })).filter((l) => l._entity);

  const entities = Array.from(new Set(rows.map((r) => r._entity)));
  const axisKeys = axis === 'quarter'
    ? quarterSummaries().map((q) => q.key)
    : Array.from(new Set(rows.map((r) => r.code).filter(Boolean)));
  const axisLabels = axis === 'quarter'
    ? quarterSummaries().map((q) => q.label)
    : axisKeys.map((c) => c);

  const matrix = entities.map((ent) => {
    const rowVals = axisKeys.map((ak) => {
      const subset = rows.filter((r) => r._entity === ent && (axis === 'quarter' ? qKey(r.quarter, r.year) === ak : r.code === ak));
      return metric === 'cost' ? subset.reduce((s, r) => s + (r.cost || 0), 0) : subset.length;
    });
    const total = rowVals.reduce((s, v) => s + v, 0);
    const quarterCount = new Set(rows.filter((r) => r._entity === ent).map((r) => qKey(r.quarter, r.year))).size;
    return { entity: ent, values: rowVals, total, quarterCount };
  }).sort((a, b) => b.total - a.total);

  return { entities: matrix, axisKeys, axisLabels };
}

// DERIVED DATA — Risk Score
// ---------------------------------------------------------------
function zoneForMoney(cost) {
  if (cost === 0) return 'green';
  if (cost <= 2000000) return 'yellow';
  return 'red';
}
function zoneForCause(caNhanRatio) {
  return caNhanRatio > 0 ? 'red' : 'yellow';
}
function zoneForCount(n) {
  if (n <= 5) return 'green';
  if (n <= 10) return 'yellow';
  return 'red';
}

function riskScoreForQuarter(qKeyStr) {
  const rows = state.lines.filter((l) => qKey(l.quarter, l.year) === qKeyStr && l.code);

  const byCode = new Map();
  rows.forEach((l) => {
    if (!byCode.has(l.code)) byCode.set(l.code, { code: l.code, name: categoryNameOf(l.code), cost: 0, lines: 0, caNhan: 0 });
    const rec = byCode.get(l.code);
    rec.cost += l.cost || 0;
    rec.lines += 1;
    if (l.cause === 'Cá nhân') rec.caNhan += 1;
  });

  return Array.from(byCode.values()).map((rec) => {
    const caNhanRatio = rec.lines ? rec.caNhan / rec.lines : 0;
    const moneyZone = zoneForMoney(rec.cost);
    const causeZone = zoneForCause(caNhanRatio);
    const countZone = zoneForCount(rec.lines);
    const redCount = [moneyZone, causeZone, countZone].filter((z) => z === 'red').length;
    let level = 'green', label = 'Theo dõi';
    if (redCount === 1) { level = 'yellow'; label = 'Xem xét can thiệp'; }
    else if (redCount >= 2) { level = 'red'; label = 'Can thiệp ngay'; }
    return { ...rec, caNhanRatio, moneyZone, causeZone, countZone, redCount, level, label };
  }).sort((a, b) => b.redCount - a.redCount || b.cost - a.cost);
}

function overviewCatSearchAnalyze(term) {
  const q = term.trim().toLowerCase();
  if (!q) return null;
  const rows = overviewTrendScope(); // đã lọc đúng theo search term này + mọi bộ lọc khác đang bật
  if (rows.length === 0) return { mode: 'none' };
  const matchingCodes = Array.from(new Set(rows.map((l) => l.code).filter(Boolean)));
  if (matchingCodes.length === 0) return { mode: 'none' };
  const map = new Map();
  rows.forEach((l) => {
    const k = qKey(l.quarter, l.year);
    if (!map.has(k)) map.set(k, { key: k, label: `${l.quarter}/${l.year}`, quarter: l.quarter, year: l.year, cost: 0, count: 0 });
    const r = map.get(k);
    r.cost += l.cost || 0;
    r.count += 1;
  });
  const series = Array.from(map.values()).sort((a, b) => a.year - b.year || compareKi(a.quarter, b.quarter));
  return { mode: 'found', codes: matchingCodes, rows, series };
}

// Plugin dùng chung cho biểu đồ tròn: đưa % ra ngoài rìa, kèm đường dẫn nối về đúng phần, chữ màu đen
function outsideLabelPlugin() {
  return {
    id: 'outsideLabelPlugin',
    afterDraw(chart) {
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const dataArr = chart.data.datasets[0].data;
      const total = dataArr.reduce((a, b) => a + b, 0);
      if (!total) return;
      meta.data.forEach((arc, i) => {
        const value = dataArr[i];
        if (!value) return;
        const pct = ((value / total) * 100).toFixed(1) + '%';
        const angle = (arc.startAngle + arc.endAngle) / 2;
        const cx = arc.x, cy = arc.y;
        const outerR = arc.outerRadius;
        const x1 = cx + Math.cos(angle) * outerR;
        const y1 = cy + Math.sin(angle) * outerR;
        const midR = outerR + 14;
        const x2 = cx + Math.cos(angle) * midR;
        const y2 = cy + Math.sin(angle) * midR;
        const dir = Math.cos(angle) >= 0 ? 1 : -1;
        const x3 = x2 + dir * 16;
        ctx.save();
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y2);
        ctx.stroke();
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 11px sans-serif';
        ctx.textAlign = dir > 0 ? 'left' : 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(pct, x3 + dir * 3, y2);
        ctx.restore();
      });
    },
  };
}

function heatCellColor(value, max, metric) {
  if (!max || value <= 0) return 'background-color:#f8fafc;color:#cbd5e1;';
  const pct = Math.min(1, value / max);
  const base = metric === 'cost' ? [234, 88, 12] : [30, 58, 138]; // cam dịu cho chi phí, navy cho số lượt
  const alpha = 0.10 + pct * 0.6;
  return `background-color:rgba(${base[0]},${base[1]},${base[2]},${alpha.toFixed(2)});color:${pct > 0.55 ? '#fff' : '#1e293b'};`;
}

// Phân tích ô tìm kiếm ở tab Khoa & Cá nhân: tự nhận diện đang tìm chuyên đề hay tìm người/khoa,
// áp dụng đúng các bộ lọc đang bật (Overview filters + Nguyên nhân riêng của tab này)
// Gộp dữ liệu tìm kiếm theo đúng chiều tương ứng (Khoa/Cá nhân cho mode 'category', Chuyên đề cho mode 'individual'/'department'),
// kèm số kì (quý) xuất hiện — để trả lời "ai/chuyên đề nào lặp lại qua mấy kì"
function computeSearchGroups(mode, rows) {
  const keyFn = mode === 'category'
    ? (state.heatmapMode === 'department' ? (l) => khoaNormalizer()(l.department) : (l) => bacSiNormalizer()(l.individual))
    : (l) => l.code;
  const map = new Map();
  rows.forEach((l) => {
    const k = keyFn(l);
    if (!k) return;
    if (!map.has(k)) map.set(k, { key: k, cost: 0, count: 0, quarters: new Set() });
    const rec = map.get(k);
    rec.cost += l.cost || 0;
    rec.count += 1;
    rec.quarters.add(qKey(l.quarter, l.year));
  });
  return Array.from(map.values()).map((r) => ({ key: r.key, cost: r.cost, count: r.count, quarterCount: r.quarters.size }))
    .sort((a, b) => b.quarterCount - a.quarterCount || b.cost - a.cost);
}

function heatmapSearchAnalyze(term) {
  const q = term.trim().toLowerCase();
  if (!q) return null;
  let rows = scopedLines();
  if (state.heatmapCause !== 'ALL') rows = rows.filter((l) => (l.cause || '') === state.heatmapCause);

  const matchingCodes = new Set();
  rows.forEach((l) => {
    if (!l.code) return;
    const name = (categoryNameOf(l.code) || '').toLowerCase();
    if (l.code.toLowerCase().includes(q) || name.includes(q)) matchingCodes.add(l.code);
  });
  if (matchingCodes.size > 0) {
    const subset = rows.filter((l) => matchingCodes.has(l.code));
    return { mode: 'category', codes: Array.from(matchingCodes), rows: subset, groups: computeSearchGroups('category', subset) };
  }

  const nBacSi = bacSiNormalizer();
  const matchingIndividuals = new Set();
  rows.forEach((l) => { const n = nBacSi(l.individual); if (n && n.toLowerCase().includes(q)) matchingIndividuals.add(n); });
  if (matchingIndividuals.size > 0) {
    const subset = rows.filter((l) => matchingIndividuals.has(nBacSi(l.individual)));
    return { mode: 'individual', names: Array.from(matchingIndividuals), rows: subset, groups: computeSearchGroups('individual', subset) };
  }

  const nKhoa = khoaNormalizer();
  const matchingDepts = new Set();
  rows.forEach((l) => { const n = nKhoa(l.department); if (n && n.toLowerCase().includes(q)) matchingDepts.add(n); });
  if (matchingDepts.size > 0) {
    const subset = rows.filter((l) => matchingDepts.has(nKhoa(l.department)));
    return { mode: 'department', names: Array.from(matchingDepts), rows: subset, groups: computeSearchGroups('department', subset) };
  }

  return { mode: 'none', rows: [] };
}

        </tr></thead>

            <td class="py-2 px-3 text-right">${fmtVND(r.costA)} đ</td><td class="py-2 px-3 text-right text-slate-400">${r.pctA.toFixed(1)}%</td>
            <td class="py-2 px-3 text-right">${fmtVND(r.costB)} đ</td><td class="py-2 px-3 text-right text-slate-400">${r.pctB.toFixed(1)}%</td>
            <td class="py-2 px-3 text-right font-medium ${r.delta > 0 ? 'text-red-600' : r.delta < 0 ? 'text-emerald-600' : 'text-slate-400'}">${r.delta > 0 ? '▲' : r.delta < 0 ? '▼' : '—'} ${fmtVND(Math.abs(r.delta))} đ</td>

}
function drawCompareChart() {
  const ctx = document.getElementById('compare-chart');
  if (state.compareChartRef) { state.compareChartRef.destroy(); state.compareChartRef = null; }
  if (!ctx) return;
  const A = rangeSummary(state.compareFromA, state.compareToA);
  const B = rangeSummary(state.compareFromB, state.compareToB);
  const rows = compareBreakdown(A.rows, A.totalCost, B.rows, B.totalCost, state.compareDimension).slice(0, 10);
  if (rows.length === 0) return;
  state.compareChartRef = new Chart(ctx, {
    type: 'bar',
    data: { labels: rows.map((r) => r.label), datasets: [
      { label: 'Giai đoạn A', data: rows.map((r) => r.costA), backgroundColor: '#94a3b8',
        datalabels: { anchor: 'end', align: 'end', color: '#64748b', font: { weight: 'bold', size: 9 }, formatter: (v) => fmtVND(v) } },
      { label: 'Giai đoạn B', data: rows.map((r) => r.costB), backgroundColor: '#009247',
        datalabels: { anchor: 'end', align: 'end', color: '#009247', font: { weight: 'bold', size: 9 }, formatter: (v) => fmtVND(v) } },
    ] },
    options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 90 } },
      scales: { x: { title: { display: true, text: 'đ' } } },
    },
  });
}

// Doanh thu BH XN/năm: dùng số thật nếu đã nhập, chưa có thì tạm ước tính = Đề nghị thanh toán BHYT (Q1+Q2) × 2
// (Lưu ý: "Doanh thu 6 tháng" là doanh thu TỔNG, không dùng làm cơ sở — Đề nghị thanh toán BHYT mới đúng là doanh thu BHYT)
function ngoaiKiemAnnualRevenue(ct) {
  if (ct.doanh_thu_bh_xn_nam != null) return { value: ct.doanh_thu_bh_xn_nam, isEstimate: false };
  // "Doanh thu 6 tháng" là doanh thu TỔNG (gồm cả nguồn ngoài BHYT) — không dùng làm cơ sở ước tính doanh thu BHYT.
  // "Đề nghị thanh toán BHYT" (Q1+Q2) mới đúng là doanh thu BHYT thật, x2 để ra ước tính cả năm.
  const q1q2 = ct.de_nghi_q1q2 != null ? ct.de_nghi_q1q2 : ((ct.de_nghi_q1 != null || ct.de_nghi_q2 != null) ? (Number(ct.de_nghi_q1) || 0) + (Number(ct.de_nghi_q2) || 0) : null);
  if (q1q2 != null) return { value: q1q2 * 2, isEstimate: true };
  return { value: null, isEstimate: false };
}
// Chi phí ngoại kiểm/năm: dùng số thật (Tổng chi phí tham gia/năm) nếu đã có, chưa có (thường gặp ở nhóm
// chưa tham gia) thì tạm dùng chi phí dự kiến năm 2027 (Phí mẫu + Phí phân tích) làm ước tính
function ngoaiKiemAnnualCost(ct) {
  if (ct.tong_chi_phi_nam != null) return { value: ct.tong_chi_phi_nam, isEstimate: false };
  const projected = (Number(ct.nam2027_phi_mau) || 0) + (Number(ct.nam2027_phi_phan_tich) || 0);
  if (projected > 0) return { value: projected, isEstimate: true };
  return { value: null, isEstimate: false };
}

const DOSSIER_STATUSES = ['Đủ hoàn toàn', 'Đủ một phần', 'Hoàn toàn thiếu'];
const DOSSIER_COLOR = {

};
function buildEquipKhoaNormalizer() {
  const caseNorm = buildNormalizer(state.equipment.map((e) => e.khoa_phong));
  return (raw) => resolveKhoaAlias(caseNorm(raw));
}
function equipKhoaNormalizer() { return state.equipKhoaNorm || buildEquipKhoaNormalizer(); }
function equipAnnualRevenue(e) { return (Number(e.doanh_thu_tb_thang) || 0) * 12; } // Doanh thu ước tính/năm — "Tổng doanh thu" gốc trong file bị lỗi #REF!, dùng doanh thu TB/tháng × 12 thay thế

function equipmentFiltered() {
  const nKhoa = equipKhoaNormalizer();
  let rows = state.equipment;
  if (state.equipmentFilterKhoa !== 'ALL') rows = rows.filter((e) => nKhoa(e.khoa_phong) === state.equipmentFilterKhoa);
  if (state.equipmentFilterStatus !== 'ALL') rows = rows.filter((e) => e.tinh_trang_hoat_dong === state.equipmentFilterStatus);
  if (state.equipmentFilterDossier !== 'ALL') rows = rows.filter((e) => e.tinh_trang_ho_so === state.equipmentFilterDossier);
  const q = state.equipmentSearch.trim().toLowerCase();
  if (q) rows = rows.filter((e) => [e.ten_tb, e.ky_hieu, e.ma_may, e.khoa_phong, e.congty_sx, e.seri].some((f) => (f || '').toLowerCase().includes(q)));
  return rows;
}

function equipmentHTML() {
  const canEdit = state.role === 'editor';
  const nKhoa = equipKhoaNormalizer();
  const all = state.equipment;
  const total = all.length;
  const byDossierCount = {}; const byDossierRevenue = {};
  DOSSIER_STATUSES.forEach((s) => { byDossierCount[s] = 0; byDossierRevenue[s] = 0; });
  all.forEach((e) => {
    const s = DOSSIER_STATUSES.includes(e.tinh_trang_ho_so) ? e.tinh_trang_ho_so : null;
    if (s) { byDossierCount[s] += 1; byDossierRevenue[s] += equipAnnualRevenue(e); }
  });
  const thieuCount = byDossierCount['Hoàn toàn thiếu'] + byDossierCount['Đủ một phần'];
  const rueRoRevenue = byDossierRevenue['Hoàn toàn thiếu'] + byDossierRevenue['Đủ một phần'];
  const pctDuHoanToan = total ? (byDossierCount['Đủ hoàn toàn'] / total) * 100 : 0;

  // Top khoa có nhiều thiết bị thiếu hồ sơ nhất (Đủ một phần + Hoàn toàn thiếu)
  const khoaThieu = new Map();
  all.filter((e) => e.tinh_trang_ho_so === 'Hoàn toàn thiếu' || e.tinh_trang_ho_so === 'Đủ một phần').forEach((e) => {
    const k = nKhoa(e.khoa_phong) || '(chưa xác định)';
    khoaThieu.set(k, (khoaThieu.get(k) || 0) + 1);
  });
  const topKhoaThieu = Array.from(khoaThieu.entries()).map(([key, value]) => ({ key, value })).sort((a, b) => b.value - a.value).slice(0, 10);

  // Tình trạng hoạt động
  const byOpStatus = new Map();
  all.forEach((e) => { const s = e.tinh_trang_hoat_dong || '(chưa rõ)'; byOpStatus.set(s, (byOpStatus.get(s) || 0) + 1); });
  const opStatusList = Array.from(byOpStatus.entries()).map(([key, value]) => ({ key, value })).sort((a, b) => b.value - a.value);

  // Tình trạng Hiệu chuẩn / Kiểm định
  const nHieuChuan = buildNormalizer(all.map((e) => e.hieu_chuan));
  const byHieuChuan = new Map();
  all.forEach((e) => { const s = nHieuChuan(e.hieu_chuan) || '(chưa rõ)'; byHieuChuan.set(s, (byHieuChuan.get(s) || 0) + 1); });
  const hieuChuanList = Array.from(byHieuChuan.entries()).map(([key, value]) => ({ key, value })).sort((a, b) => b.value - a.value);
  const nKiemDinh = buildNormalizer(all.map((e) => e.kiem_dinh));
  const byKiemDinh = new Map();
  all.forEach((e) => { const s = nKiemDinh(e.kiem_dinh) || '(chưa rõ)'; byKiemDinh.set(s, (byKiemDinh.get(s) || 0) + 1); });
  const kiemDinhList = Array.from(byKiemDinh.entries()).map(([key, value]) => ({ key, value })).sort((a, b) => b.value - a.value);

  // Top rủi ro: thiếu hồ sơ + doanh thu ước tính cao nhất
  const topRisk = all.filter((e) => e.tinh_trang_ho_so === 'Hoàn toàn thiếu' || e.tinh_trang_ho_so === 'Đủ một phần')
    .map((e) => ({ ...e, _annual: equipAnnualRevenue(e) })).sort((a, b) => b._annual - a._annual).slice(0, 10);

  const khoaOptions = Array.from(new Set(all.map((e) => nKhoa(e.khoa_phong)).filter(Boolean))).sort();
  const opStatusOptions = Array.from(new Set(all.map((e) => e.tinh_trang_hoat_dong).filter(Boolean))).sort();

  const rows = equipmentFiltered();

  return `
    <div class="flex items-center justify-between flex-wrap gap-2 mb-4">
      <p class="text-sm text-slate-500">Tra cứu trang thiết bị BHYT — theo dõi tình trạng hồ sơ pháp lý phục vụ giám định BHYT (${total} thiết bị).</p>
      <div class="flex gap-2">
        ${canEdit ? `<input type="file" id="equip-import-file" accept=".xlsx,.xls" class="hidden" /><button id="btn-equip-import" class="border border-slate-300 text-slate-700 rounded-md px-3 py-1.5 text-sm font-medium hover:bg-slate-50">Import Excel</button>` : ''}
        ${canEdit ? '<button id="btn-equip-add" class="bg-brand-900 text-white rounded-md px-3 py-1.5 text-sm font-medium hover:bg-brand-800">+ Thêm thiết bị</button>' : ''}
      </div>
    </div>
    <div id="equip-import-msg"></div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
      ${statCard('Tổng số thiết bị', total.toLocaleString('vi-VN'), 'blue')}
      ${statCard('Thiết bị thiếu hồ sơ (thiếu 1 phần + hoàn toàn)', thieuCount.toLocaleString('vi-VN'), thieuCount > 0 ? 'red' : 'emerald')}
      ${statCard('Doanh thu ước tính/năm — nhóm thiếu hồ sơ', fmtVND(rueRoRevenue) + ' đ', rueRoRevenue > 0 ? 'red' : 'emerald')}
      ${statCard('Tỉ lệ đã đủ hồ sơ hoàn toàn', pctDuHoanToan.toFixed(1) + '%', 'emerald')}
    </div>

    <div class="grid md:grid-cols-2 gap-4 mb-4">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Tình trạng hồ sơ — theo số lượng thiết bị</h3>
        <div style="height:280px"><canvas id="equip-dossier-count-chart"></canvas></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Tình trạng hồ sơ — theo doanh thu ước tính/năm</h3>
        <div style="height:280px"><canvas id="equip-dossier-revenue-chart"></canvas></div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4 mb-4">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Top Khoa/Phòng có nhiều thiết bị thiếu hồ sơ nhất</h3>
        ${topKhoaThieu.length === 0 ? '<div class="text-sm text-slate-400 py-8 text-center">Không có thiết bị nào thiếu hồ sơ 🎉</div>' : `<div style="height:${Math.max(200, topKhoaThieu.length * 32)}px"><canvas id="equip-top-khoa-chart"></canvas></div>`}
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Tình trạng hoạt động</h3>
        <div style="height:${Math.max(200, opStatusList.length * 32)}px"><canvas id="equip-op-status-chart"></canvas></div>
      </div>
    </div>

    <div class="grid md:grid-cols-2 gap-4 mb-4">
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Tình trạng Hiệu chuẩn</h3>
        ${hieuChuanList.length === 0 ? '<div class="text-sm text-slate-400 py-8 text-center">Chưa có dữ liệu</div>' : `<div style="height:${Math.max(200, hieuChuanList.length * 32)}px"><canvas id="equip-hieuchuan-chart"></canvas></div>`}
      </div>
      <div class="bg-white border border-slate-200 rounded-lg p-4">
        <h3 class="text-sm font-semibold text-slate-700 mb-2">Tình trạng Kiểm định</h3>
        ${kiemDinhList.length === 0 ? '<div class="text-sm text-slate-400 py-8 text-center">Chưa có dữ liệu</div>' : `<div style="height:${Math.max(200, kiemDinhList.length * 32)}px"><canvas id="equip-kiemdinh-chart"></canvas></div>`}
      </div>
    </div>

    <div class="bg-white border border-slate-200 rounded-lg p-4 mb-4">
      <h3 class="text-sm font-semibold text-slate-700 mb-3">⚠ Ưu tiên xử lý — thiếu hồ sơ, doanh thu ước tính/năm cao nhất</h3>
      ${topRisk.length === 0 ? '<div class="text-sm text-slate-400 py-6 text-center">Không có thiết bị nào cần ưu tiên xử lý 🎉</div>' : simpleTable(
        ['Tên thiết bị', 'Khoa', 'Tình trạng hồ sơ', 'Doanh thu ước tính/năm'],
        topRisk.map((e) => [escapeHtml(e.ten_tb), escapeHtml(nKhoa(e.khoa_phong)), `${DOSSIER_COLOR[e.tinh_trang_ho_so]?.dot || ''} ${escapeHtml(e.tinh_trang_ho_so || '')}`, fmtVND(e._annual) + ' đ'])
      )}
    </div>

    <div class="bg-white border border-slate-200 rounded-lg p-3 mb-4 flex flex-wrap gap-2 items-center">
      <input id="equip-search" type="text" placeholder="Tìm theo tên, ký hiệu, mã máy, khoa, hãng SX, seri..." value="${escapeHtml(state.equipmentSearch)}" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm flex-1 min-w-[240px]" />
      <select id="equip-filter-khoa" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
        <option value="ALL">Khoa: Tất cả</option>
        ${khoaOptions.map((k) => `<option value="${escapeHtml(k)}" ${state.equipmentFilterKhoa === k ? 'selected' : ''}>${escapeHtml(k)}</option>`).join('')}
      </select>
      <select id="equip-filter-status" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
        <option value="ALL">Tình trạng hoạt động: Tất cả</option>
        ${opStatusOptions.map((k) => `<option value="${escapeHtml(k)}" ${state.equipmentFilterStatus === k ? 'selected' : ''}>${escapeHtml(k)}</option>`).join('')}
      </select>
      <select id="equip-filter-dossier" class="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white">
        <option value="ALL">Tình trạng hồ sơ: Tất cả</option>
        ${DOSSIER_STATUSES.map((k) => `<option value="${k}" ${state.equipmentFilterDossier === k ? 'selected' : ''}>${k}</option>`).join('')}
      </select>
    </div>
    <div class="bg-brand-50 border border-brand-200 rounded-lg px-4 py-3 mb-3 flex items-center justify-between flex-wrap gap-2">
      <span class="text-sm font-medium text-brand-700">Tổng doanh thu BH ước tính/năm (theo bộ lọc/tìm kiếm đang áp dụng)</span>
      <span class="text-lg font-bold text-brand-700">${fmtVND(rows.reduce((s, e) => s + equipAnnualRevenue(e), 0))} đ</span>
    </div>
    <div class="text-xs text-slate-400 mb-2">${rows.length} thiết bị</div>
    ${state.equipAdding ? equipFormHTML(null) : ''}
    <div class="space-y-2">
      ${rows.length === 0 ? '<div class="text-sm text-slate-400 py-10 text-center bg-white border border-slate-200 rounded-lg">Không tìm thấy thiết bị phù hợp</div>' : rows.map((e) => equipItemHTML(e, canEdit)).join('')}
    </div>
  `;
}

function equipItemHTML(e, canEdit) {
  const expanded = state.equipExpanded.has(String(e.id));
  if (state.equipEditingId === e.id) return equipFormHTML(e);
  const dossier = DOSSIER_COLOR[e.tinh_trang_ho_so];
  const docChecklist = [
    ['Hiệu chuẩn', e.hieu_chuan], ['Kiểm định', e.kiem_dinh], ['Hợp đồng', e.hop_dong],
    ['Bàn giao NT', e.ban_giao_nt], ['Hoá đơn', e.hoa_don], ['CO', e.co], ['CQ', e.cq], ['TKHQ', e.tkhq],
  ];
  return `
    <div class="bg-white border border-slate-200 rounded-lg overflow-hidden">
      <button data-equip-toggle="${e.id}" class="w-full text-left px-4 py-3 flex items-start justify-between gap-3 hover:bg-slate-50">
        <div>
          ${e.tinh_trang_ho_so ? `<span class="text-[11px] font-medium rounded px-1.5 py-0.5 mr-2 border ${dossier ? dossier.badge : 'bg-slate-50 text-slate-600 border-slate-200'}">${dossier ? dossier.dot : ''} ${escapeHtml(e.tinh_trang_ho_so)}</span>` : ''}
          <span class="text-sm font-medium text-slate-800">${escapeHtml(e.ten_tb || '(chưa đặt tên)')}</span>
          <span class="text-xs text-slate-400 ml-2">${escapeHtml(e.khoa_phong || '')}</span>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <span class="text-xs font-medium rounded px-1.5 py-0.5 border bg-slate-50 text-slate-600 border-slate-200 whitespace-nowrap w-32 text-right">${e.doanh_thu_tb_thang ? fmtVND(equipAnnualRevenue(e)) + ' đ/năm' : '—'}</span>
          <span class="text-slate-400 text-sm">${expanded ? '▲' : '▼'}</span>
        </div>
      </button>
      ${expanded ? `
        <div class="px-4 pb-4 pt-1 border-t border-slate-100 text-sm">
          <div class="grid md:grid-cols-3 gap-3 mb-3">
            <div><div class="text-xs text-slate-400">Ký hiệu / Model</div><div>${escapeHtml(e.ky_hieu || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Hãng SX / Nước SX</div><div>${escapeHtml(e.congty_sx || '—')} / ${escapeHtml(e.nuoc_sx || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Năm SX / Năm SD</div><div>${e.nam_sx || '—'} / ${e.nam_sd || '—'}</div></div>
            <div><div class="text-xs text-slate-400">Mã máy</div><div class="font-mono text-xs">${escapeHtml(e.ma_may || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Số lưu hành</div><div>${escapeHtml(e.so_luu_hanh || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Seri</div><div>${escapeHtml(e.seri || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Tình trạng hoạt động</div><div>${escapeHtml(e.tinh_trang_hoat_dong || '—')}</div></div>
            <div><div class="text-xs text-slate-400">Doanh thu TB/tháng</div><div>${e.doanh_thu_tb_thang ? fmtVND(e.doanh_thu_tb_thang) + ' đ' : '—'}</div></div>
            <div><div class="text-xs text-slate-400">Số năm sử dụng</div><div>${e.so_nam_su_dung ?? '—'}</div></div>
          </div>
          <div class="mb-3">
            <div class="text-xs text-slate-400 mb-1">Giấy tờ hồ sơ</div>
            <div class="flex flex-wrap gap-1.5">
              ${docChecklist.map(([label, val]) => `<span class="text-[11px] rounded px-1.5 py-0.5 border ${val && val !== 'Không áp dụng' ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-400 border-slate-200'}">${label}: ${escapeHtml(val || '—')}</span>`).join('')}
            </div>
          </div>
          ${e.de_xuat ? `<div class="mb-3"><div class="text-xs text-slate-400 mb-1">Đề xuất xử lý</div><div class="text-slate-700 whitespace-pre-line">${nl2br(e.de_xuat)}</div></div>` : ''}
          ${canEdit ? `<div class="flex gap-3 pt-1"><button data-equip-edit="${e.id}" class="text-xs text-brand-700 hover:underline">Sửa</button><button data-equip-delete="${e.id}" class="text-xs text-red-600 hover:underline">Xoá</button></div>` : ''}
        </div>` : ''}
    </div>`;
}

      <div class="grid md:grid-cols-2 gap-3 mb-3">
        <div><label class="text-xs text-slate-600">Tên thiết bị *</label><input data-ef="ten_tb" type="text" value="${escapeHtml(v.ten_tb)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Ký hiệu / Model</label><input data-ef="ky_hieu" type="text" value="${escapeHtml(v.ky_hieu)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Khoa/Phòng đang sử dụng</label><input data-ef="khoa_phong" type="text" value="${escapeHtml(v.khoa_phong)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Tình trạng hoạt động</label><input data-ef="tinh_trang_hoat_dong" type="text" value="${escapeHtml(v.tinh_trang_hoat_dong)}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
        <div><label class="text-xs text-slate-600">Tình trạng hồ sơ</label><select data-ef="tinh_trang_ho_so" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm bg-white"><option value="">— Chưa xác định —</option>${DOSSIER_STATUSES.map((s) => `<option value="${s}" ${v.tinh_trang_ho_so === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div><label class="text-xs text-slate-600">Doanh thu trung bình/tháng (đ)</label><input data-ef="doanh_thu_tb_thang" type="text" inputmode="numeric" value="${v.doanh_thu_tb_thang ? fmtVND(v.doanh_thu_tb_thang) : ''}" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm" /></div>
      </div>
      <div class="mb-3"><label class="text-xs text-slate-600">Đề xuất xử lý</label><textarea data-ef="de_xuat" rows="2" class="mt-1 w-full border border-slate-300 rounded px-2 py-1.5 text-sm">${escapeHtml(v.de_xuat || '')}</textarea></div>
      <div class="flex gap-2">
        <button data-equip-save="${e ? e.id : 'new'}" class="bg-brand-900 text-white rounded-md px-3 py-1.5 text-sm font-medium hover:bg-brand-800">Lưu</button>
        <button data-equip-cancel="${e ? e.id : 'new'}" class="border border-slate-300 rounded-md px-3 py-1.5 text-sm">Huỷ</button>
      </div>
    </div>`;
}

function drawNgoaiKiemCharts() {
  const thamGia = state.ngoaiKiemList.filter((ct) => !(ct.section || '').includes('không'));
  const khongThamGia = state.ngoaiKiemList.filter((ct) => (ct.section || '').includes('không'));

  const ctx1 = document.getElementById('ngoaikiem-status-count-chart');
  if (state.ngoaiKiemStatusCountChartRef) { state.ngoaiKiemStatusCountChartRef.destroy(); state.ngoaiKiemStatusCountChartRef = null; }
  if (ctx1 && (thamGia.length + khongThamGia.length) > 0) {
    state.ngoaiKiemStatusCountChartRef = new Chart(ctx1, {
      type: 'doughnut',
      data: { labels: ['Đã tham gia', 'Chưa tham gia'], datasets: [{ data: [thamGia.length, khongThamGia.length], backgroundColor: ['#059669', '#dc2626'], borderWidth: 2, borderColor: '#fff' }] },
      plugins: [outsideLabelPlugin()],
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 24, bottom: 24, left: 70, right: 70 } },
        plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 14 } }, datalabels: { display: false } },
      },
    });
  }

  const doanhThuAnToan = thamGia.reduce((s, ct) => s + (Number(ct.doanh_thu_6thang) || 0), 0);
  const doanhThuNguyCo = khongThamGia.reduce((s, ct) => s + (Number(ct.nguy_co_xuat_toan) || 0), 0);
  const ctx2 = document.getElementById('ngoaikiem-status-revenue-chart');
  if (state.ngoaiKiemStatusRevenueChartRef) { state.ngoaiKiemStatusRevenueChartRef.destroy(); state.ngoaiKiemStatusRevenueChartRef = null; }
  if (ctx2 && (doanhThuAnToan + doanhThuNguyCo) > 0) {
    state.ngoaiKiemStatusRevenueChartRef = new Chart(ctx2, {
      type: 'doughnut',
      data: { labels: ['An toàn (đã tham gia)', 'Nguy cơ (chưa tham gia)'], datasets: [{ data: [doanhThuAnToan, doanhThuNguyCo], backgroundColor: ['#059669', '#dc2626'], borderWidth: 2, borderColor: '#fff' }] },
      plugins: [outsideLabelPlugin()],
      options: { responsive: true, maintainAspectRatio: false, layout: { padding: { top: 24, bottom: 24, left: 70, right: 70 } },
        plugins: { legend: { position: 'right', labels: { font: { size: 11 }, boxWidth: 14 } }, datalabels: { display: false } },
      },
    });
  }

  const topRisk = [...khongThamGia].sort((a, b) => (Number(b.nguy_co_xuat_toan) || 0) - (Number(a.nguy_co_xuat_toan) || 0)).slice(0, 10);
  const ctx3 = document.getElementById('ngoaikiem-risk-chart');
  if (state.ngoaiKiemRiskChartRef) { state.ngoaiKiemRiskChartRef.destroy(); state.ngoaiKiemRiskChartRef = null; }
  if (ctx3 && topRisk.length > 0) {
    state.ngoaiKiemRiskChartRef = new Chart(ctx3, {
      type: 'bar',
      data: { labels: topRisk.map((ct) => ct.ten_chuong_trinh), datasets: [{ label: 'Nguy cơ xuất toán (đ)', data: topRisk.map((ct) => Number(ct.nguy_co_xuat_toan) || 0), backgroundColor: '#dc2626',
        datalabels: { anchor: 'end', align: 'end', color: '#dc2626', font: { weight: 'bold', size: 10 }, formatter: (v) => fmtVND(v) } }] },
      options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, layout: { padding: { right: 90 } },
        scales: { x: { title: { display: true, text: 'đ' } } }, plugins: { legend: { display: false } },
        onHover: onHoverPointer,
        onClick: (evt, elements) => { if (elements.length) { const id = topRisk[elements[0].index].id; state.ngoaiKiemExpanded.add(String(id)); renderTab(); } },
      },
    });
  }
}
function drawEquipmentCharts() {
  const all = state.equipment;
  const byCount = {}; const byRevenue = {};
  DOSSIER_STATUSES.forEach((s) => { byCount[s] = 0; byRevenue[s] = 0; });
  all.forEach((e) => {
    const s = DOSSIER_STATUSES.includes(e.tinh_trang_ho_so) ? e.tinh_trang_ho_so : null;
    if (s) { byCount[s] += 1; byRevenue[s] += equipAnnualRevenue(e); }
  });
  const labels = DOSSIER_STATUSES.filter((s) => byCount[s] > 0);
  const colors = labels.map((s) => DOSSIER_COLOR[s].chart);

  const ctx1 = document.getElementById('equip-dossier-count-chart');
  if (state.equipDossierCountChartRef) { state.equipDossierCountChartRef.destroy(); state.equipDossierCountChartRef = null; }
  if (ctx1 && labels.length) {
    state.equipDossierCountChartRef = new Chart(ctx1, {
      type: 'doughnut',
      data: { labels, datasets: [{ data: labels.map((s) => byCount[s]), backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },

async function handleNgoaiKiemImport(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('ngoaikiem-import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheetName = wb.SheetNames.find((n) => /ngoại kiểm/i.test(n)) || wb.SheetNames[0];
    const ws = wb.Sheets[sheetName];
    if (!ws || !ws['!ref']) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không tìm thấy sheet dữ liệu.</div>`; return; }
    const range = XLSX.utils.decode_range(ws['!ref']);
    const get = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
    const toNum = (v) => { const n = Number(v); return (v === undefined || v === '' || isNaN(n)) ? null : n; };

    let section = null;
    const programs = [];
    let currentParent = null;
    for (let r = 3; r <= range.e.r; r++) {
      const colA = get(r, 0);
      const colB = get(r, 1);
      if (typeof colA === 'string' && colA.includes('Chương trình')) { section = colA; currentParent = null; continue; }
      if (colA === 'STT') continue;
      if (colA === undefined && colB === undefined) continue;
      if (typeof colA === 'number') {
        currentParent = {
          section, stt: colA, ten_chuong_trinh: String(colB || '').trim(),
          gia_mau: toNum(get(r, 2)), ncc_mau: String(get(r, 3) || '').trim(), gia_phan_tich: toNum(get(r, 4)), tong_chi_phi_nam: toNum(get(r, 5)),
          de_nghi_q1: toNum(get(r, 6)), de_nghi_q2: toNum(get(r, 7)), de_nghi_q1q2: toNum(get(r, 8)), doanh_thu_6thang: toNum(get(r, 9)),
          ty_le_chi_phi: section && !section.includes('không') ? toNum(get(r, 10)) : null,
          nguy_co_xuat_toan: section && section.includes('không') ? toNum(get(r, 10)) : null,
          nam2027_phi_mau: toNum(get(r, 11)), nam2027_ncc_mau: String(get(r, 12) || '').trim(), nam2027_phi_phan_tich: toNum(get(r, 13)),
          children: [],
        };
        programs.push(currentParent);
      } else if (colB !== undefined && currentParent) {
        currentParent.children.push({
          ten_dich_vu: String(colB || '').trim(), de_nghi_q1: toNum(get(r, 6)), de_nghi_q2: toNum(get(r, 7)), de_nghi_q1q2: toNum(get(r, 8)), doanh_thu_6thang: toNum(get(r, 9)),
        });
      }
    }
    if (programs.length === 0) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được chương trình nào hợp lệ.</div>`; return; }

    let totalChildren = 0;
    for (const p of programs) {
      const { children, ...ctPayload } = p;
      const { data, error } = await sb.from('bhyt_ngoai_kiem_chuong_trinh').insert(ctPayload).select().single();
      if (error) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Lỗi khi ghi chương trình "${escapeHtml(p.ten_chuong_trinh)}": ${escapeHtml(error.message)}</div>`; return; }
      if (children.length) {
        const rows = children.map((c) => ({ ...c, chuong_trinh_id: data.id }));
        const { error: err2 } = await sb.from('bhyt_ngoai_kiem_dich_vu').insert(rows);
        if (err2) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Lỗi khi ghi dịch vụ con: ${escapeHtml(err2.message)}</div>`; return; }
        totalChildren += children.length;
      }
    }
    await loadAll();
    msgEl.innerHTML = `<div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm mb-3">Đã thêm ${programs.length} chương trình, ${totalChildren} dịch vụ con.</div>`;
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được file: ${escapeHtml(err.message || String(err))}</div>`;
  } finally {
    ev.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 8000);
  }
}
async function saveDvktTimeField(id, field, value) {

  if (error) { alert('Lỗi khi lưu: ' + error.message); return; }
  const row = state.dvktTimeList.find((d) => String(d.id) === String(id));
  if (row) Object.assign(row, patch);

async function deleteDvktTimeRow(id) {

async function handleDvktTimeImport(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('dvkt-time-import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheetName = wb.SheetNames.find((n) => /tổng hợp/i.test(n)) || wb.SheetNames[wb.SheetNames.length - 1];
    const ws = wb.Sheets[sheetName];
    if (!ws || !ws['!ref']) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không tìm thấy sheet dữ liệu.</div>`; return; }
    const range = XLSX.utils.decode_range(ws['!ref']);
    const rows = [];
    // Cột (0-indexed): 0=ID Nhóm cha, 1=Tên Nhóm cha, 2=ID, 3=Tên dịch vụ, 4=Khoa/Phòng, 5=Thời gian tối thiểu, 6=Ghi Chú, 7=Link
    for (let r = 1; r <= range.e.r; r++) {
      const get = (c) => ws[XLSX.utils.encode_cell({ r, c })];
      const tenDichVuCell = get(3);
      if (!tenDichVuCell || tenDichVuCell.v === undefined || tenDichVuCell.v === '') continue;
      const linkCell = get(7);
      const thoiGianRaw = get(5) ? get(5).v : null;
      const thoiGianNum = Number(thoiGianRaw);
      rows.push({
        id_nhom_cha: (() => { const n = Number(get(0) ? get(0).v : null); return isNaN(n) ? null : n; })(),
        ten_nhom_cha: String((get(1) && get(1).v) || '').trim(),
        dvkt_id: String((get(2) && get(2).v) || '').trim(),
        ten_dich_vu: String(tenDichVuCell.v || '').trim(),
        khoa_phong: String((get(4) && get(4).v) || '').trim(),
        thoi_gian_toi_thieu: (thoiGianRaw === null || thoiGianRaw === '' || isNaN(thoiGianNum)) ? null : thoiGianNum,
        ghi_chu: String((get(6) && get(6).v) || '').trim(),
        link_text: String((linkCell && linkCell.v) || '').trim(),
        link_url: (linkCell && linkCell.l && linkCell.l.Target) ? linkCell.l.Target : '',
      });
    }
    if (rows.length === 0) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được dòng nào hợp lệ.</div>`; return; }
    const CHUNK = 500;
    for (let i = 0; i < rows.length; i += CHUNK) {
      const { error } = await sb.from('bhyt_dvkt_thoigian').insert(rows.slice(i, i + CHUNK));
      if (error) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Lỗi khi ghi: ${escapeHtml(error.message)}</div>`; return; }
    }
    await loadAll();
    const withLink = rows.filter((r) => r.link_url).length;
    msgEl.innerHTML = `<div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm mb-3">Đã thêm ${rows.length} dòng (${withLink} dòng có link).</div>`;
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được file: ${escapeHtml(err.message || String(err))}</div>`;
  } finally {
    ev.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 8000);
  }
}
async function handleEquipmentImport(ev) {
  const file = ev.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('equip-import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheetName = wb.SheetNames.includes('189') ? '189' : wb.SheetNames[0];
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
    const toIntOrNull = (v) => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
    const toNumOrNull = (v) => { const n = Number(v); return (v === '' || isNaN(n)) ? null : n; };
    const rows = raw.map((r) => ({
      stt: toIntOrNull(r['STT']),
      ten_tb: String(r['TEN_TB'] || '').trim(),
      ky_hieu: String(r['KY_HIEU'] || '').trim(),
      congty_sx: String(r['CONGTY_SX'] || '').trim(),
      nuoc_sx: String(r['NUOC_SX'] || '').trim(),
      nam_sx: toIntOrNull(r['NAM_SX']),
      nam_sd: toIntOrNull(r['NAM_SD']),
      ma_may: String(r['MA_MAY'] || '').trim(),
      so_luu_hanh: String(r['SO_LUU_HANH'] || '').trim(),
      hd_tu: String(r['HD_TU'] || '').trim(),
      hd_den: String(r['HD_DEN'] || '').trim(),
      hieu_luc_tu: String(r['TU_NGAY'] || '').trim(),

      cong_bhxh: String(r['Cổng BHXH'] || '').trim(),
      tinh_trang_hoat_dong: String(r['Tình trạng hoạt động'] || '').trim(),
      khoa_phong: String(r['Khoa Phòng đang sử dụng'] || '').trim(),
      seri: String(r['Seri'] || '').trim(),
      hieu_chuan: String(r['Hiệu chuẩn'] || '').trim(),
      kiem_dinh: String(r['Kiểm định'] || '').trim(),
      hop_dong: String(r['Hợp đồng'] || '').trim(),
      ban_giao_nt: String(r['Bàn giao NT'] || '').trim(),
      hoa_don: String(r['Hoá đơn'] || '').trim(),
      co: String(r['CO'] || '').trim(),
      cq: String(r['CQ'] || '').trim(),
      tkhq: String(r['TKHQ'] || '').trim(),
      phan_loai_tb: String(r['Phân loại TB'] || '').trim(),
      tinh_trang_ho_so: String(r['Tình trạng hồ sơ'] || '').trim(),
      doanh_thu_tb_thang: toNumOrNull(r['Doanh thu trung bình/tháng']),
      so_nam_su_dung: toNumOrNull(r['Số năm sử dụng']),
      tong_doanh_thu: toNumOrNull(r['Tổng doanh thu']),
      de_xuat: String(r['Đề xuất'] || '').trim(),
    })).filter((r) => r.ten_tb);

    if (rows.length === 0) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được dòng nào hợp lệ từ sheet "${escapeHtml(sheetName)}".</div>`; return; }
    const { error } = await sb.from('bhyt_equipment').insert(rows);
    if (error) { msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Lỗi khi ghi: ${escapeHtml(error.message)}</div>`; return; }
    await loadAll();
    msgEl.innerHTML = `<div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm mb-3">Đã thêm ${rows.length} thiết bị.</div>`;
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm mb-3">Không đọc được file: ${escapeHtml(err.message || String(err))}</div>`;
  } finally {
    ev.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 8000);
  }
}

function isLocked(quarter, year) {
  const p = state.periods.find((x) => x.quarter === quarter && x.year === year);
  return !!(p && p.locked);
}
// Bắt nhập lại mật khẩu tài khoản để xác nhận thao tác trên dữ liệu đã khoá.
// Xác thực thật (không phải chỉ hỏi cho có) bằng cách đăng nhập lại qua Supabase.
async function confirmPassword(actionLabel) {
  const pw = prompt(`Dữ liệu thuộc kì đã KHOÁ. Nhập lại mật khẩu tài khoản (${state.user.email}) để xác nhận ${actionLabel}:`);
  if (!pw) return false;
  const { error } = await sb.auth.signInWithPassword({ email: state.user.email, password: pw });
  if (error) { alert('Sai mật khẩu — thao tác đã bị huỷ.'); return false; }
  return true;
}
// Nếu bất kỳ dòng nào trong danh sách thuộc kì đã khoá, bắt xác thực mật khẩu 1 lần cho cả lô.
async function checkLockedRows(rows, actionLabel) {
  const hasLocked = rows.some((l) => isLocked(l.quarter, l.year));
  if (!hasLocked) return true;
  return await confirmPassword(actionLabel);
}

async function saveLineField(id, field, value) {
  const row = state.lines.find((l) => String(l.id) === String(id));
  if (row && isLocked(row.quarter, row.year)) {
    const ok = await confirmPassword('sửa dữ liệu kì đã khoá');
    if (!ok) { renderTab(); return; }
  }
  const patch = { [field]: field === 'year' ? Number(value) : field === 'cost' ? parseMoney(value) : value };
  await sb.from('bhyt_lines').update(patch).eq('id', id);
  if (row) Object.assign(row, patch);
}

async function deleteLineRow(id) {
  const row = state.lines.find((l) => String(l.id) === String(id));
  if (!row) return;
  if (isLocked(row.quarter, row.year)) {
    const ok = await confirmPassword('xoá 1 dòng thuộc kì đã khoá');
    if (!ok) return;
  } else {
    if (!confirm('Chuyển dòng này vào thùng rác? Có thể khôi phục lại trong 30 ngày.')) return;
  }
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.trash.push({ ...row, deleted_at: new Date().toISOString() });
  state.lines = state.lines.filter((l) => String(l.id) !== String(id));
  renderTab();
}

async function bulkDeleteVisibleLines() {
  const rows = visibleDetailRows();
  if (rows.length === 0) return;
  const okLock = await checkLockedRows(rows, `xoá ${rows.length} dòng đang hiển thị (có dòng thuộc kì đã khoá)`);
  if (!okLock) return;

  const distinctKis = Array.from(new Set(rows.map((r) => qKey(r.quarter, r.year))));
  if (distinctKis.length > 1) {
    const typed = prompt(`CẢNH BÁO: ${rows.length} dòng này trải trên ${distinctKis.length} kì khác nhau (${distinctKis.join(', ')}). Đây là thao tác dễ nhầm phạm vi — gõ đúng chữ XOÁ (in hoa) để xác nhận chuyển vào thùng rác:`);
    if (typed !== 'XOÁ') { alert('Đã huỷ, không có gì bị xoá.'); return; }
  } else {
    if (!confirm(`Chuyển ${rows.length} dòng đang hiển thị vào thùng rác? Có thể khôi phục lại trong 30 ngày.`)) return;
  }

  const ids = rows.map((r) => r.id);
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).in('id', ids);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  const idSet = new Set(ids.map(String));
  const now = new Date().toISOString();
  state.trash = state.trash.concat(rows.map((r) => ({ ...r, deleted_at: now })));
  state.lines = state.lines.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function deleteBlankLines() {
  const rows = blankLines();
  if (rows.length === 0) return;
  const okLock = await checkLockedRows(rows, `xoá ${rows.length} dòng trống (có dòng thuộc kì đã khoá)`);
  if (!okLock) return;
  if (!confirm(`Chuyển ${rows.length} dòng trống vào thùng rác? Có thể khôi phục lại trong 30 ngày.`)) return;
  const ids = rows.map((r) => r.id);
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: new Date().toISOString() }).in('id', ids);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  const idSet = new Set(ids.map(String));
  const now = new Date().toISOString();
  state.trash = state.trash.concat(rows.map((r) => ({ ...r, deleted_at: now })));
  state.lines = state.lines.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function restoreLine(id) {
  const { error } = await sb.from('bhyt_lines').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('Lỗi khi khôi phục: ' + error.message); return; }
  const row = state.trash.find((l) => String(l.id) === String(id));
  if (row) { row.deleted_at = null; state.lines.push(row); }
  state.trash = state.trash.filter((l) => String(l.id) !== String(id));
  renderTab();
}
async function permanentlyDeleteLine(id) {
  if (!confirm('Xoá VĨNH VIỄN dòng này khỏi thùng rác? Không thể khôi phục lại được nữa.')) return;
  const { error } = await sb.from('bhyt_lines').delete().eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.trash = state.trash.filter((l) => String(l.id) !== String(id));
  renderTab();
}
async function emptyOldTrash() {
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
  const cutoff = Date.now() - THIRTY_DAYS;
  const oldIds = state.trash.filter((l) => new Date(l.deleted_at).getTime() < cutoff).map((l) => l.id);
  if (oldIds.length === 0) { alert('Chưa có mục nào trong thùng rác quá 30 ngày.'); return; }
  if (!confirm(`Xoá VĨNH VIỄN ${oldIds.length} dòng đã nằm trong thùng rác quá 30 ngày? Không thể khôi phục lại.`)) return;
  const { error } = await sb.from('bhyt_lines').delete().in('id', oldIds);
  if (error) { alert('Lỗi khi dọn thùng rác: ' + error.message); return; }
  const idSet = new Set(oldIds.map(String));
  state.trash = state.trash.filter((l) => !idSet.has(String(l.id)));
  renderTab();
}

async function addPeriodRow() {

  let quarter = null, year = null;
  outer:
  for (let y = new Date().getFullYear(); y <= new Date().getFullYear() + 1; y++) {
    for (const q of QUARTERS) {
      if (!existing.has(qKey(q, y))) { quarter = q; year = y; break outer; }

  if (!quarter) { alert('Không tìm được kỳ trống để thêm (đã có đủ Q1-Q4 của 2 năm gần đây). Hãy sửa trực tiếp 1 dòng đã có.'); return; }

function readReferenceForm() {

  return { name: get('name'), source: get('source') || 'DKHA', phu_luc: get('phu_luc'), category_group: get('category_group'), legal_basis: get('legal_basis'), payment_basis: get('payment_basis'), audit_rule: get('audit_rule'), note: get('note') };
}
async function saveReferenceForm(idOrNew) {
  const payload = readReferenceForm();
  if (!payload.name) { alert('Vui lòng nhập tên chuyên đề.'); return; }
  if (idOrNew === 'new') {
    const { data, error } = await sb.from('bhyt_reference').insert(payload).select().single();
    if (error) { alert('Lỗi khi thêm: ' + error.message); return; }
    state.reference.push(data);
    state.refAdding = false;
  } else {
    const id = Number(idOrNew);
    const { error } = await sb.from('bhyt_reference').update(payload).eq('id', id);
    if (error) { alert('Lỗi khi lưu: ' + error.message); return; }
    const row = state.reference.find((r) => r.id === id);
    if (row) Object.assign(row, payload);
    state.refEditingId = null;
  }
  renderTab();
}
async function deleteReferenceItem(id) {
  if (!confirm('Xoá chuyên đề này khỏi bảng tra cứu?')) return;
  const { error } = await sb.from('bhyt_reference').delete().eq('id', id);
  if (error) { alert('Lỗi khi xoá: ' + error.message); return; }
  state.reference = state.reference.filter((r) => r.id !== id);
  renderTab();
}

// ---------------------------------------------------------------
// IMPORT / EXPORT EXCEL
// ---------------------------------------------------------------
function dedupeBy(rows, keyFn) {
  const map = new Map();
  rows.forEach((r) => map.set(keyFn(r), r));
  return Array.from(map.values());
}
async function handleImport(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  const msgEl = document.getElementById('import-msg');
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = (name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name], { defval: '' }) : [];

    const lineRows = sheet('Chi tiết xuất toán')
      .map((r) => ({
        quarter: normalizeQuarter(r['Quý']), year: Number(r['Năm']) || null,
        individual: String(r['Họ tên người thực hiện/CĐ'] || '').trim(),
        department: String(r['Khoa'] || '').trim(),
        cost: Number(r['Chi phí']) || 0,
        service: String(r['Dịch vụ'] || '').trim(),
        error_desc: String(r['Lỗi'] || '').trim(),
        code: resolveCode(String(r['Phụ lục'] || '').trim()),
        cause: String(r['Nguyên nhân'] || '').trim() || null,
        remediator: String(r['Người khắc phục'] || r['Phụ trách khắc phục chính'] || '').trim(),
        link_code: String(r['Mã LK'] || '').trim(),
      }))
      .filter((r) => r.quarter && r.year);

    const periodRows = sheet('Doanh thu BHYT')
      .map((r) => ({ quarter: normalizeQuarter(r['Quý']), year: Number(r['Năm']) || null, revenue: Number(r['Doanh thu BHYT']) || 0 }))
      .filter((r) => r.quarter && r.year);

    const catRows = dedupeBy(
      sheet('Danh mục chuyên đề')
        .map((r) => ({ code: String(r['Mã (Phụ lục)'] || r['Mã chuyên đề'] || '').trim(), name: String(r['Tên chuyên đề'] || '').trim(), category_group: String(r['Nhóm'] || '').trim() }))
        .filter((r) => r.code),
      (r) => r.code
    );

    // Tự thêm các mã Phụ lục xuất hiện trong dữ liệu chi tiết nhưng chưa có trong Danh mục chuyên đề (để không mất mã nào)
    const knownCodes = new Set(catRows.map((c) => c.code));
    const existingCodes = new Set(state.categories.map((c) => c.code)); // mã đã có sẵn trên hệ thống — không đụng tới, tránh xoá mất Nhóm đã điền trước đó
    lineRows.forEach((l) => {
      if (l.code && !knownCodes.has(l.code) && !existingCodes.has(l.code)) {
        knownCodes.add(l.code);
        catRows.push({ code: l.code, name: l.error_desc || '', category_group: '' });
      }
    });

    const dedupedPeriods = dedupeBy(periodRows, (r) => qKey(r.quarter, r.year));

    const results = [];
    if (catRows.length) results.push(['Danh mục chuyên đề', await sb.from('bhyt_categories').upsert(catRows, { onConflict: 'code' })]);
    if (dedupedPeriods.length) results.push(['Doanh thu BHYT', await sb.from('bhyt_periods').upsert(dedupedPeriods, { onConflict: 'quarter,year' })]);

    if (lineRows.length) {
      const CHUNK = 500;
      for (let i = 0; i < lineRows.length; i += CHUNK) {
        const chunk = lineRows.slice(i, i + CHUNK);
        const res = await sb.from('bhyt_lines').insert(chunk);
        results.push([`Chi tiết xuất toán (dòng ${i + 1}-${i + chunk.length})`, res]);
      }
    }

    const failed = results.filter(([, res]) => res.error);
    await loadAll();
    if (failed.length) {
      msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm">Lỗi khi ghi ${failed.map(([n]) => n).join(', ')}: ${failed.map(([, res]) => res.error.message).join(' | ')}</div></div>`;
    } else {
      msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md px-3 py-2 text-sm">Đã thêm ${lineRows.length} dòng chi tiết, ${dedupedPeriods.length} kỳ doanh thu, ${catRows.length} mã chuyên đề.</div></div>`;
    }
    renderTab();
  } catch (err) {
    msgEl.innerHTML = `<div class="max-w-7xl mx-auto px-6 pb-3"><div class="bg-red-50 text-red-700 border border-red-200 rounded-md px-3 py-2 text-sm">Không đọc được file: ${escapeHtml(err.message || String(err))}</div></div>`;
  } finally {
    e.target.value = '';
    setTimeout(() => { msgEl.innerHTML = ''; }, 8000);
  }
}

function handleExport() {
  const wb = XLSX.utils.book_new();
  const lineSheet = XLSX.utils.json_to_sheet(state.lines.map((l) => ({
    'Quý': QUARTER_VN[l.quarter] || l.quarter, 'Năm': l.year, 'Họ tên người thực hiện/CĐ': l.individual,
    'Khoa': l.department, 'Chi phí': l.cost, 'Dịch vụ': l.service, 'Lỗi': l.error_desc, 'Phụ lục': l.code, 'Nguyên nhân': l.cause, 'Người khắc phục': l.remediator, 'Mã LK': l.link_code,
  })));
  XLSX.utils.book_append_sheet(wb, lineSheet, 'Chi tiết xuất toán');
  const perSheet = XLSX.utils.json_to_sheet(state.periods.map((p) => ({ 'Quý': QUARTER_VN[p.quarter] || p.quarter, 'Năm': p.year, 'Doanh thu BHYT': p.revenue })));
  XLSX.utils.book_append_sheet(wb, perSheet, 'Doanh thu BHYT');
  const catSheet = XLSX.utils.json_to_sheet(state.categories.map((c) => ({ 'Mã (Phụ lục)': c.code, 'Tên chuyên đề': c.name, 'Nhóm': c.category_group })));
  XLSX.utils.book_append_sheet(wb, catSheet, 'Danh mục chuyên đề');
  XLSX.writeFile(wb, `Xuat_toan_BHYT_export_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

init();
</script>
